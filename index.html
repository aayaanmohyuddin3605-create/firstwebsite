<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gartic Link</title>
    <style>
        body {
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            background: linear-gradient(180deg, #5b06bd 0%, #88009b 50%, #a5057a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        /* Big card box styled to match the form container precisely */
        .card {
            background: linear-gradient(180deg, #9d1c6c 0%, #b5319f 100%);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 
                0 0 0 2px #df5cb0, /* Orchid-pink framing border */
                0 0 0 7px #221468, /* Thick dark navy outer outline frame */
                0 15px 0 #221468;  /* Thick dark navy 3D bottom drop shadow */
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 { 
            color: #ffffff; 
            margin-bottom: 15px;
            font-size: 28px;
            text-shadow: 3px 3px 0px #221468;
            letter-spacing: 1px;
        }
        p { 
            color: #ffffff; 
            font-size: 16px; 
            margin-bottom: 30px; 
            line-height: 1.5; 
            font-weight: bold;
            text-shadow: 1px 1px 0px #73115d;
        }
        /* The custom teal button layout with top glossy highlight overlay */
        .link-btn {
            display: inline-block;
            background-color: #00e5a3;
            color: #221468;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 1px;
            border: 4px solid #221468;
            box-shadow: 0 6px 0 #221468;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s, box-shadow 0.1s;
            text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff;
        }
        /* Smooth top highlight arc simulation layer */
        .link-btn::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 5%;
            width: 90%;
            height: 40%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 40px 40px 25px 25px;
            pointer-events: none;
        }
        .link-btn:hover { background-color: #16f7b5; }
        .link-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #221468;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>CONNECT PROFILE</h2>
        <p>Link your official account to synchronize your data instantly and jump straight into the action!</p>
        
        <!-- Routes cleanly on your desktop over to form.html -->
        <a href="form.html" class="link-btn">LINK</a>
    </div>

</body>
</html>
